name: Build NoReelInsta IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct download link to your decrypted Instagram .ipa"
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build tools (GNU make, ldid, dpkg)
        run: |
          brew install make ldid dpkg xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME"/theos-sdks/*.sdk "$HOME/theos/sdks/"
          echo "Available SDKs:"; ls "$HOME/theos/sdks"
          # The Makefile asks for iPhoneOS16.2.sdk; if it's missing, alias the newest available SDK to that name
          if [ ! -d "$HOME/theos/sdks/iPhoneOS16.2.sdk" ]; then
            NEWEST=$(ls -d "$HOME"/theos/sdks/iPhoneOS*.sdk | sort -V | tail -n 1)
            echo "iPhoneOS16.2.sdk not found, using $NEWEST"
            cp -R "$NEWEST" "$HOME/theos/sdks/iPhoneOS16.2.sdk"
          fi
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install cyan and ipapatch
        run: |
          python -m venv "$HOME/cyanenv"
          "$HOME/cyanenv/bin/pip" install --upgrade pip
          "$HOME/cyanenv/bin/pip" install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          "$HOME/cyanenv/bin/cyan" -h > /dev/null && echo "cyan OK"
          echo "$HOME/cyanenv/bin" >> "$GITHUB_PATH"
          go install github.com/asdfzxcvbn/ipapatch@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download decrypted Instagram IPA
        run: |
          mkdir -p packages
          curl -L --fail -o packages/com.burbn.instagram.ipa "${{ inputs.ipa_url }}"
          file packages/com.burbn.instagram.ipa
          unzip -l packages/com.burbn.instagram.ipa | grep -q "Payload/" || { echo "Not a valid IPA"; exit 1; }

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh sideload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NoReelInsta-sideloaded
          path: packages/NoReelInsta-sideloaded.ipa
          retention-days: 3
